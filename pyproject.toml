[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "boto3>=1.34",
    "psutil>=5.9",
    "duckdb>=1.1",
    "pyarrow>=14.0",
    "tpchgen-cli>=2.0",
]

[project.optional-dependencies]
duckdb = [
    "lakehouse-bench",
]
spark = [
    # Pin to Spark 4.0.x: the Iceberg runtime jar we load is iceberg-spark-runtime-4.0
    # (Iceberg 1.10.x ships no 4.1 build). Spark 4.1 changed the DataSourceV2Relation.create
    # signature, so a 4.1 runtime makes Iceberg's compaction actions fail with
    # NoSuchMethodError. Keep pyspark and the Iceberg Spark runtime on the same minor.
    "pyspark>=4.0,<4.1",
    "lakehouse-bench[duckdb]",
]
plot = [
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
all = [
    "lakehouse-bench[duckdb,spark]",
]

[tool.hatch.build.targets.wheel]
packages = ["catalogs", "engines", "benchmarks", "setup"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
